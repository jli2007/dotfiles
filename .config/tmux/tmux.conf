# ─────────────────────────────────────────────────────────────
#  tmux  ·  prefix is ctrl+b (left at the default on purpose,
#           so every tutorial and StackOverflow answer matches)
#
#  shell:   tmux        new session
#           tmux a      attach to an existing one
#           tmux ls     list sessions
#           tmux kill-session -t NAME
#
#  prefix d      detach, session keeps running in the background
#  prefix |  -   split right / split down  (opens in $PWD)
#  prefix hjkl   move between panes
#  prefix HJKL   resize pane (repeatable, no re-press of prefix)
#  prefix c      new window      prefix n / p   next / prev
#  prefix 1..9   jump to window
#  prefix z      zoom pane fullscreen (toggle)
#  prefix x      close pane      prefix &  close window
#  prefix [      scroll/copy mode: v select, y copy, q quit
#  prefix r      reload this file
# ─────────────────────────────────────────────────────────────

# ── truecolor ────────────────────────────────────────────────
# tmux advertises itself as tmux-256color, then we tell it that
# Ghostty's terminal (TERM=xterm-ghostty) is RGB-capable. Without
# the second line, themes degrade to 256 colors and look muddy.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# ── behaviour ────────────────────────────────────────────────
set -sg escape-time 0          # default 500ms makes Esc lag in nvim
set -g mouse on                # click panes, scroll, drag borders
set -g base-index 1            # windows start at 1, matching the keys
setw -g pane-base-index 1
set -g renumber-windows on     # no gaps after closing a window
set -g history-limit 50000     # default 2000 is uselessly short
set -g focus-events on         # lets nvim autoread/autosave react
set -g set-clipboard on        # OSC52, so copy works over ssh too
set -g display-time 2000

# ── splits ───────────────────────────────────────────────────
# | and - instead of the unmemorable " and %, and both inherit
# the current pane's directory rather than dumping you in $HOME.
unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── pane navigation ──────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r = repeatable, hold the key without re-pressing the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── copy mode (vi keys) ──────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── status bar · rose pine moon ──────────────────────────────
# Plain text, no glyphs, so it renders correctly regardless of font.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#232136,fg=#908caa"
set -g status-left  "#[fg=#c4a7e7,bold] #S #[default]"
set -g status-right "#[fg=#6e6a86]#{?client_prefix,#[fg=#eb6f92]PREFIX ,}#[fg=#908caa]%H:%M "
set -g status-left-length 30

setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[fg=#e0def4,bg=#393552,bold] #I #W #[default]"

set -g pane-border-style        "fg=#393552"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style            "bg=#393552,fg=#e0def4"
